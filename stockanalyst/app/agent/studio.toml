[project]
name = "stockanalyst-agent"

[stack]
# Project-lifetime facts: which framework / runtime adapter recipes this
# Agent was scaffolded against. doctor / dev / deploy read these to know
# what to check, load, and route. framework: adk; runtime: agentcore | azure-foundry.
framework = "adk"
runtime = "agentcore"
# External protocol this runtime serves (one runtime, one signer):
#   A2A — serve_a2a: agent card + negotiate/notify_funded skills.
#   MCP — FastMCP on /mcp: negotiate (signed quote) + notify_funded (verify →
#         deliver → submit, synchronously within the tool call) + read-only chain
#         tools. MCP delivery runs in-call (≤ ~15 min); the runtime is stateful.
protocol = "A2A"

[network]
default = "bsc-mainnet"

[deploy]
# Deploy destination (orthogonal to [stack].runtime). 'platform' deploys
# through the BNB Chain managed platform as a 48h TESTNET TRIAL sandbox
# (auto-reclaimed at 48h), not a production seller. `bag deploy` dispatches
# on this; it records [deploy.platform] (slug/deployment_id/invoke_url)
# post-deploy. Absent ⇒ self (deploy to your own cloud via [stack].runtime).
destination = "self"
# Artifact channel: 'codezip' for self-hosted AgentCore (managed runtime, no
# Docker), 'zip' for platform uploads, or 'container' when Node is required.
platform_artifact = "codezip"
packaging = "codezip"
iam_notice_accepted_at = "2026-07-29T08:12:28Z"
iam_notice_version = 1
last_deploy_at = "2026-08-11T02:39:55Z"
runtime_arn = "arn:aws:bedrock-agentcore:us-east-1:201243086760:runtime/stockanalystmainnet_stockanalystmainnet-GVFwe5Etrj"
# Public mainnet x402 gateway base; clients append /x402/* routes.
#   X402_GATEWAY_PUBLIC_BASE_URL=https://stock-agent.bnbchain.org

# Names-only contract for the protected runtime environment. Values remain in
# the deployment secret and are never recorded in this tracked file.
# BEGIN RUNTIME SECRET NAME CONTRACT
# runtime-secret-name: ALPHA_VANTAGE_API_KEY
# runtime-secret-name: B402_ACCESS_TOKEN
# runtime-secret-name: B402_BASE_URL
# runtime-secret-name: B402_CLIENT_ID
# runtime-secret-name: B402_PAY_TO_ADDRESS
# runtime-secret-name: B402_PRIVATE_KEY
# runtime-secret-name: COMPETITION_AI_CALLS_URL
# runtime-secret-name: COMPETITION_INTERNAL_TOKEN
# runtime-secret-name: DELIVERABLE_PUBLIC_BASE
# runtime-secret-name: DELIVERABLE_S3_BUCKET
# runtime-secret-name: DELIVERABLE_S3_PREFIX
# runtime-secret-name: GNEWS_API_KEY
# runtime-secret-name: OAUTH_SCOPE
# runtime-secret-name: OAUTH_TOKEN_URL
# runtime-secret-name: OPENROUTER_API_KEY
# runtime-secret-name: U_TOKEN_DOMAIN_NAME
# runtime-secret-name: U_TOKEN_DOMAIN_VERSION
# runtime-secret-name: WALLET_KEYSTORE_JSON
# runtime-secret-name: WALLET_PASSWORD
# runtime-secret-name: X402_ASYNC_ACCEPT_NEW_JOBS
# runtime-secret-name: X402_CHAIN_ID
# runtime-secret-name: X402_JOB_S3_BUCKET
# runtime-secret-name: X402_JOB_S3_PREFIX
# runtime-secret-name: X402_JOB_TOKEN_SECRET
# runtime-secret-name: X402_TOKEN_ADDRESS
# END RUNTIME SECRET NAME CONTRACT

[wallet]
# Local keystore signer. The Agent is the SOLE key-holder/signer.
# The keystore lives at the WORKSPACE root — outside app/agent (the AgentCore
# codeLocation) — so no packaging path can bundle it into a deploy artifact.
kind = "evm-local"
signer = "local"
keystore_dir = "../../.studio/wallets"
# address = "0x..."   # filled by `bag wallet new`
address = "0xd10BdDC20E4DC42A1a19a9653e994991e25b8153"

[llm]
provider = "openrouter"
model = "moonshotai/kimi-k2.6"
base_url = "https://openrouter.ai/api/v1"

[llm.pieverse]
# Pieverse topup runs ONLY on BSC mainnet (chainId=56); decoupled from [network].default.
network = "bsc-mainnet"
# key_hash = "..."        # written by `bag llm activate`
# zero-deposit default. `bag llm activate` creates the key with $0
# allocation; switch to a paid model + `bag llm topup` only when you need it.
initial_allocation_usd = 0
key_hash = "4e900e64aed7ac67192eddf7c06f27c53934f099eadee16ed934bf4980985322"

[llm.auto_renew]
# (v0.0.1): hook auto-allocates from Pieverse Account Balance to the
# API key when Key Credit < min_balance_usd. Account Balance is NEVER refilled
# automatically from your wallet UNLESS you opt in via `bag budget enable`
# — defaults below stay in allocate-only mode. This
# automatic `load_model()` hook IS the agent's LLM-credit self-top-up (NOT an
# LLM-callable tool).
enabled = true            # set false to opt out of in-process auto-allocate
min_balance_usd = 0.01    # Key Credit threshold that triggers allocate
topup_chunk_usd = 1.0     # chunk pulled from Account Balance per allocate
max_topup_per_day_usd = 3.0   # opt-in cap; only enforced when `bag budget enable` is on
check_interval_seconds = 60

[payments.erc8183]
# Read by the Agent: it quotes the FIXED `price`, CLAMPS it to [min,max],
# freezes a short-TTL offer, and EIP-191 signs it — pricing is rule-based, the
# LLM never prices.
currency = "0xcE24439F2D9C6a2289F741120FE202248B666666"   # $U token address — BSC mainnet
price = "210000000000000000"                   # wei — 0.21 U per analysis
min_price = "210000000000000000"               # wei — 0.21 U floor
max_price = "5000000000000000000"              # wei — 5.0 U ceiling
quote_ttl_seconds = 900                        # seconds a signed quote stays valid; SDK caps at 900 (~15min work window)
default_estimated_completion_seconds = 600
poll_interval_seconds = 30
auto_settle = false                            # opt-in: detect dispute-window-elapsed → settle

[storage]
# Local development fallback. Deployed S3 deliverable storage is installed
# at runtime from DELIVERABLE_S3_BUCKET, DELIVERABLE_PUBLIC_BASE, and optional
# DELIVERABLE_S3_PREFIX environment variables after runtime secrets load.
kind = "s3"


[payments.x402]
# Optional: PIN the trusted Pieverse pay-to address. Leave empty — `bag llm
# topup` / auto-topup auto-discover it from the hardcoded, SIWE-authenticated
# topup endpoint (validated chain + U asset). Set a value only to pin a
# specific recipient; the generic x402 buyer still never trusts an un-pinned
# payTo from an arbitrary URL.
expected_recipient = ""
allowed_hosts = ["llm.pieverse.io"]

[payments.x402.seller]
# x402 / Binance Pay seller channel — alternative to ERC-8183 for lower-friction
# payments. Exposes durable asynchronous jobs; buyers pay with EIP-3009 for
# U/USD1 or Permit2 exact for USDC/USDT and poll with a private job token.
# Payment verification is FIXED CODE in x402_verify.py — never LLM-callable.
enabled = true
price_wei = "100000000000000000"       # exact 0.1 selected token (18 decimals)
min_price_wei = "100000000000000000"   # 0.1-token floor
endpoint = "/x402/analyze/async"
# Price info:  GET /x402/price
# Create:      POST /x402/analyze/async  (Payment-Signature: <base64 proof>) → 202
# Poll:        GET /x402/jobs/{jobId}    (X-Job-Token: <private token>)

# ── Dual-port deployment (platform-side) ──────────────────────────────────────
# When `bag deploy` reads port + public = true, it:
#   1. Sets X402_PORT=<port> in the container env → agent starts a second
#      uvicorn listener on this port serving ONLY x402 routes (no A2A, no Cognito)
#   2. Exposes that port as a separate public endpoint (no AgentCore auth gateway)
#   3. Returns x402_url in `bag deploy info` output
# This lets the x402 channel (Payment-Signature auth) coexist with the A2A channel
# (Cognito Bearer auth) without routing conflicts inside AgentCore.
port = 9001
public = true

# ── Binance B402 V2 facilitator (preferred) ─────────────────────────────────
# Binance supplies clientId, accessToken, and an environment-specific base URL
# during onboarding. B402_PRIVATE_KEY is the partner-owned, one-line Base64
# PKCS#8 DER private key registered for that account. All four values are
# required; there is intentionally no default base URL.
#   bag env set B402_CLIENT_ID     <your-clientId>
#   bag env set B402_ACCESS_TOKEN  <your-accessToken>
#   bag env set B402_BASE_URL      <your-Binance-sandbox-base-URL>
#   bag env set B402_PRIVATE_KEY   <your-Base64-PKCS8-private-key>
# Dedicated B402 payment recipient; independent from the Studio signing wallet.
#   bag env set B402_PAY_TO_ADDRESS 0x15958aad30b758dAbfbB9788Da69dfcd56e89078
#
# ── Generic x402 facilitator (fallback, unauthenticated) ───────────────────
#   bag env set X402_FACILITATOR_URL https://x402.org/facilitate
#
# ── Fixed x402 token registry (BSC mainnet, chain ID 56) ─────────────────
# U:    0xcE24439F2D9C6a2289F741120FE202248B666666
#       domain "United Stables", version "1", 18 decimals, exact amount 0.1 U
# USD1: 0x8d0D000Ee44948FC98c9B98A4FA4921476f08B0d
#       domain "World Liberty Financial USD", version "1", 18 decimals,
#       exact amount 0.1 USD1
# USDC: 0x8AC76a51cc950d9822D68b83fE1Ad97B32Cd580d
#       domain "USD Coin", version "2", 18 decimals, permit2-exact,
#       exact amount 0.1 USDC
# USDT: 0x55d398326f99059fF775485246999027B3197955
#       domain "Tether USD", version "1", 18 decimals, permit2-exact,
#       exact amount 0.1 USDT
# Paid requirements use a valid signerAddress and B402 settlement. The signer
# is facilitator EOA metadata, while the live spenderAddress is the B402 proxy
# and Permit2 typed-data spender. ERC-20 approval still targets canonical
# Permit2 0x000000000022D473030F116dDEE9F6B43aC78BA3.
# Every asynchronous create requires a valid payment proof. Wallet admission
# allows 30 accepted new jobs per rolling hour before B402 verification or
# settlement; an exact retry reuses its accepted reservation and does not use
# another slot.
#
# ── Legacy U token compatibility settings ─────────────────────────────────
#   bag env set U_TOKEN_DOMAIN_NAME    United Stables
#   bag env set U_TOKEN_DOMAIN_VERSION 1
#
# These legacy variables support older local integrations only. They cannot
# add, replace, or override entries in the fixed four-token registry above.
#   bag env set X402_CHAIN_ID      56
#   bag env set X402_TOKEN_ADDRESS 0xcE24439F2D9C6a2289F741120FE202248B666666
#
# ── Competition successful-call accounting (optional) ──────────────────────
# Set both variables to enable reporting; leave both unset to disable it.
# COMPETITION_AI_CALLS_URL is the complete backend API URL, including its path.
#   bag env set COMPETITION_AI_CALLS_URL https://<backend>/<api-path>
#   bag env set COMPETITION_INTERNAL_TOKEN <internal-token>

# ── Asynchronous x402 reports (optional; all required together) ─────────────
# At expiresAt, authenticated polling stops and the API issues or renews no
# download URLs. A URL minted beforehand remains independently usable until its
# own expiry, at most 30 minutes. S3 Lifecycle marks each object eligible for
# asynchronous AWS-controlled expiration seven days after its LastModified; it
# is not an exact physical-deletion deadline. Use a dedicated private bucket
# that has never had Versioning enabled; bucket reuse is unsupported here.
# Grant only s3:GetObject and s3:PutObject on the configured x402-jobs/* prefix.
# Full public-access-block, Lifecycle, IAM, verification, and rollback commands:
#   ../../README.md#configure-private-storage-for-asynchronous-x402-jobs
#   export X402_JOB_S3_BUCKET='replace-with-private-bucket-name'
#   bag env set X402_JOB_S3_BUCKET "$X402_JOB_S3_BUCKET"
#   bag env set X402_JOB_S3_PREFIX x402-jobs
#   export X402_JOB_TOKEN_SECRET="$(openssl rand -hex 32)"
#   bag env set X402_JOB_TOKEN_SECRET "$X402_JOB_TOKEN_SECRET"
#   bag env set X402_ASYNC_ACCEPT_NEW_JOBS 1
#
# To stop accepting new jobs while preserving query/resume/download for paid
# jobs, set X402_ASYNC_ACCEPT_NEW_JOBS=0 and redeploy. Keep the bucket, prefix
# access, and token secret through the latest job's expiresAt plus 30 minutes.
#   bag env set X402_ASYNC_ACCEPT_NEW_JOBS 0
#   bag deploy agent --force-deploy-broken-storage
