AWSTemplateFormatVersion: "2010-09-09"
Description: Fixed outbound IPv4 for the stockanalyst AgentCore Runtime

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-0352b4298bb340895
  PublicSubnetId:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-0d048dae4a6c29540
  PrivateSubnetCidr:
    Type: String
    Default: 172.31.96.0/24
    AllowedPattern: ^172\.31\.96\.0/24$
  AvailabilityZone:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: us-east-1a

Resources:
  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcId
      AvailabilityZone: !Ref AvailabilityZone
      CidrBlock: !Ref PrivateSubnetCidr
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: stockanalyst-agentcore-private-us-east-1a
        - Key: Project
          Value: stockanalyst-agent
        - Key: Purpose
          Value: fixed-egress
        - Key: ManagedBy
          Value: cloudformation
        - Key: Environment
          Value: testnet

  EgressElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: stockanalyst-fixed-egress-eip
        - Key: Project
          Value: stockanalyst-agent
        - Key: Purpose
          Value: fixed-egress
        - Key: ManagedBy
          Value: cloudformation
        - Key: Environment
          Value: testnet

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt EgressElasticIp.AllocationId
      ConnectivityType: public
      SubnetId: !Ref PublicSubnetId
      Tags:
        - Key: Name
          Value: stockanalyst-fixed-egress-nat
        - Key: Project
          Value: stockanalyst-agent
        - Key: Purpose
          Value: fixed-egress
        - Key: ManagedBy
          Value: cloudformation
        - Key: Environment
          Value: testnet

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: stockanalyst-agentcore-private-rt
        - Key: Project
          Value: stockanalyst-agent
        - Key: Purpose
          Value: fixed-egress
        - Key: ManagedBy
          Value: cloudformation
        - Key: Environment
          Value: testnet

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: NatGateway
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnet

  RuntimeSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Outbound network access for stockanalyst AgentCore
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - Description: Agent outbound connectivity
          IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: stockanalyst-agentcore-vpc-sg
        - Key: Project
          Value: stockanalyst-agent
        - Key: Purpose
          Value: fixed-egress
        - Key: ManagedBy
          Value: cloudformation
        - Key: Environment
          Value: testnet

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Gateway
      VpcId: !Ref VpcId
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      RouteTableIds:
        - !Ref PrivateRouteTable
      Tags:
        - Key: Name
          Value: stockanalyst-agentcore-s3-endpoint
        - Key: Project
          Value: stockanalyst-agent
        - Key: Purpose
          Value: fixed-egress
        - Key: ManagedBy
          Value: cloudformation
        - Key: Environment
          Value: testnet

Outputs:
  EgressPublicIp:
    Description: Public IPv4 address to provide to B402
    Value: !Ref EgressElasticIp
  EgressAllocationId:
    Value: !GetAtt EgressElasticIp.AllocationId
  NatGatewayId:
    Value: !Ref NatGateway
  PrivateSubnetId:
    Value: !Ref PrivateSubnet
  RuntimeSecurityGroupId:
    Value: !GetAtt RuntimeSecurityGroup.GroupId
  PrivateRouteTableId:
    Value: !Ref PrivateRouteTable
  S3EndpointId:
    Value: !Ref S3GatewayEndpoint
